[package]
name = "cairn-rockchip"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# `cdylib` is the NIF library the BEAM loads; `rlib` is how the probe binary
# reaches the `rknn` backend it registers.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cairn-rockchip-probe"
path = "src/bin/cairn-rockchip-probe.rs"

[dependencies]
anyhow = "1.0"
cairn-detect = { path = "../../../../plugins/cairn-detect" }
# The engine hosting — registry, gate, packing, teardown, term shapes and error
# vocabulary — with `CairnOrt`'s own NIF entry off: rustler would otherwise
# fold its NIFs into this library's.
cairn-ort = { path = "../../../../plugins/cairn-ort", default-features = false }
libc = "0.2"
libloading = "0.8"
serde_json = "1.0"
rustler = "0.38"

[features]
# Passed through to cairn-detect (directly and via cairn-ort's passthrough of
# the same feature) for the aarch64 cross-build, where ort loads
# the runtime at startup instead of statically linking the downloaded x86
# archive.
ort-load-dynamic = ["cairn-detect/ort-load-dynamic", "cairn-ort/ort-load-dynamic"]

[profile.release]
lto = "thin"
strip = true
