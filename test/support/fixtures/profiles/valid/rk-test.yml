# A single-model profile exercising most schema fields (qnn is experimental,
# so a group running this one has to set allow_experimental: true).
name: rk-test
experimental: true
backend: qnn
model:
  qnn: test/support/fixtures/models/stub.onnx
model_profile: yolox
input_size: 416
decoder: auto
labels: test/support/fixtures/models/stub.names
fps_band: [2, 4]
tracking:
  bbd: true
  oru:
    step_ms: 700
  twin_mint: true
  max_unseen_ms: 6000
  tracker: sparsetrack
