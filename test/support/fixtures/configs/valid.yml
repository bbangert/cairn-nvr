# The application's Config.Server publishes these three cameras into its
# snapshot for the whole suite: a test that starts a real camera tree under
# one of their ids without a `config_lookup:` gets this file's camera
# merged over its own. Use unique ids for trees.
data_dir: tmp/cairn_test_data
stall_seconds: 15
free_space_min_mb: 512

events:
  pre_window_seconds: 5
  post_window_seconds: 10
  max_event_seconds: 300

retention:
  days: 14
  per_label:
    person: 30

integrations:
  token: test-ha-token

cameras:
  - id: cam_a
    rtsp_url: rtsp://127.0.0.1:8554/a
    min_score:
      default: 0.5
      person: 0.6
  - id: cam_b
    rtsp_url: rtsp://127.0.0.1:8554/b
    transcode: false
    extra_ffmpeg_args: []
    retention:
      days: 7
  # detection runs on the sub stream, recording on main: the two carry
  # independent stream epochs (Cairn.StreamEpochs)
  - id: cam_dual
    rtsp_url: rtsp://127.0.0.1:8554/d
    substream_url: rtsp://127.0.0.1:8554/d_sub
    ingest: rtsp
    # the dual-stream camera is exactly the one that needs it: detections are
    # timed against the sub, artifacts are cut from main
    annotation_offset_ms: -400
