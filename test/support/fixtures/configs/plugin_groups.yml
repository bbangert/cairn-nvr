data_dir: tmp/cairn_test_data
stall_seconds: 15

profile_dirs:
  - test/support/fixtures/profiles/argv

plugins:
  detect:
    profile: partial
  spare:
    profile: partial

cameras:
  - id: cam_a
    rtsp_url: rtsp://127.0.0.1:8554/a
    plugin: detect
    min_score:
      default: 0.5
      person: 0.6
  - id: cam_b
    rtsp_url: rtsp://127.0.0.1:8554/b
  - id: cam_c
    rtsp_url: rtsp://127.0.0.1:8554/c
    plugin: detect
