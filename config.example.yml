# Cairn NVR configuration — copy to config.yml (or set CAIRN_CONFIG).
# The UI renders this read-only; apply changes via restart or the Reload
# button on /config.

# All mutable state (db, event clips, snapshots, logs) lives here.
# Overridable with the CAIRN_DATA_DIR environment variable.
data_dir: data

# Seconds without a new fragment before a camera is considered stalled
# and its ffmpeg process is bounced.
stall_seconds: 15

# Emergency cleanup: when free space on data_dir drops below this,
# oldest events are deleted regardless of retention.
free_space_min_mb: 2048

# Rewrite each finished clip into a plain mp4 (ffmpeg -c copy, no re-encode).
# Recording writes concatenated fmp4 fragments that carry the camera's absolute
# decode times and declare no duration, so without this a clip reports its
# length as "time since ffmpeg started" — a 60s event two hours in probes as a
# two-hour file — and seeking is meaningless. Costs one extra read+write of the
# clip at finalize. Set false only if minimising disk writes matters more than
# clips knowing how long they are.
remux_clips: true

# UDP ports handed to inference plugins / WebRTC RTP taps.
# Each camera consumes 4 ports: plugin RTP at base_port + 4*index and WebRTC
# RTP at +2, with each odd port left free for the matching RTCP socket that
# standard RTP receivers bind.
udp:
  base_port: 17000
  range: 100

# Event clip windows (per-camera overridable with the same keys).
events:
  pre_window_seconds: 5
  post_window_seconds: 10
  max_event_seconds: 300

# Object tracking (both keys are per-camera overridable under the camera). A
# track that goes unseen for this much *stream* time is ended; its object_id
# (a ULID) is never handed to anything else. max_live_tracks caps how many
# tracks one camera may hold at once — at the cap the least recently seen one
# is retired (end_reason "evicted"), so a plugin that mints a fresh track id
# every frame cannot grow the host's state without bound.
tracking:
  max_unseen_ms: 3000
  max_live_tracks: 128

# Days to keep event clips; per-label overrides win.
retention:
  days: 14
  per_label:
    person: 30

# Third-party integrations. The Home Assistant API (/api) is disabled unless a
# token is set here; requests must send it as `Authorization: Bearer <token>`
# (or `?access_token=<token>` for media URLs). Generate one with e.g.
# `openssl rand -hex 32`. Leave commented out to keep /api returning 401.
# integrations:
#   token: "replace-with-a-long-random-secret"

# Named plugin groups: one process serves every camera that names it, launched
# with a --cameras-json array of its members instead of the per-camera flags.
# Use this for an accelerator only one process can hold at a time (a Coral Edge
# TPU is the motivating case); otherwise give each camera its own inline
# command below. A group is restarted only when its command, membership, or a
# member's min_score or UDP port changes — never when a member camera stops.
# plugins:
#   detect:
#     # the path to your built binary, resolved from Cairn's own working
#     # directory — not from the plugin's
#     command: plugins/cairn-detect/target/release/cairn-detect --model yolov10n.onnx --labels coco.names

cameras: []
#  - id: front_door
#    rtsp_url: rtsp://user:pass@192.168.1.10:554/stream1
#    # Inference plugin. A list, or a string with whitespace, is an inline
#    # command run as this camera's own process; a single whitespace-free
#    # token names a group under `plugins:` above (undefined ⇒ config error).
#    # An inline command of one token must therefore be a one-element list.
#    # Receives RTP on an assigned UDP port, prints ndjson detections on stdout.
#    plugin: ["plugins/cairn-detect/target/release/cairn-detect"]
#    min_score:
#      default: 0.5
#      person: 0.6
#    extra_ffmpeg_args: []
#    # Opt-in hardware transcode for non-H.264 cameras (v4l2m2m only).
#    transcode: false
#    retention:
#      days: 7
