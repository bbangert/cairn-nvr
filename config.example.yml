# Cairn NVR configuration — copy to config.yml (or set CAIRN_CONFIG).
# The UI renders this read-only; apply changes via restart or the Reload
# button on /config.

# All mutable state (db, event clips, snapshots, logs) lives here.
# Overridable with the CAIRN_DATA_DIR environment variable.
data_dir: data

# Seconds without a new fragment before a camera is considered stalled
# and its ffmpeg process is bounced.
stall_seconds: 15

# Emergency cleanup: when free space on data_dir drops below this,
# oldest events are deleted regardless of retention.
free_space_min_mb: 2048

# Rewrite each finished clip into a plain mp4 (ffmpeg -c copy, no re-encode).
# Recording writes concatenated fmp4 fragments that carry the camera's absolute
# decode times and declare no duration, so without this a clip reports its
# length as "time since ffmpeg started" — a 60s event two hours in probes as a
# two-hour file — and seeking is meaningless. Costs one extra read+write of the
# clip at finalize. Set false only if minimising disk writes matters more than
# clips knowing how long they are.
remux_clips: true

# UDP ports handed to inference plugins / WebRTC RTP taps.
# Each camera consumes 4 ports: plugin RTP at base_port + 4*index and WebRTC
# RTP at +2, with each odd port left free for the matching RTCP socket that
# standard RTP receivers bind.
udp:
  base_port: 17000
  range: 100

# Event clip windows (per-camera overridable with the same keys).
events:
  pre_window_seconds: 5
  post_window_seconds: 10
  max_event_seconds: 300

# Object tracking (the three bounds here are per-camera overridable under the
# camera; bbd and oru are not).
# A track that goes unseen for this much *stream* time is ended — five times
# that while it is stationary, so a parked object outlasts what parks in front
# of it; its object_id (a ULID) is never handed to anything else.
# max_live_tracks caps how many tracks one camera may hold at once — at the cap
# the least recently seen one is retired (end_reason "evicted"), so a plugin
# that mints a fresh track id every frame cannot grow the host's state without
# bound.
# stationary_after_ms is how long an object's box must hold still, in stream
# time, before the track is reported as stationary. Leaving that state is
# sustained too, over a fixed couple of seconds that is not configurable: it is
# sized against detector jitter rather than against the scene.
# bbd adds a second admission test to matching: a detection that overlaps a
# track's predicted box not at all may still be matched to it on the distance
# between their centres, scaled by the box's size and by how long the track has
# gone unmatched. What it buys is a moving object that vanishes for longer than
# it takes to clear its own width — beyond that, overlap is zero for the right
# detection and the wrong one alike. It is off by default because widening what
# a track will answer to is also how an identity goes to the wrong object; a
# stationary track is excluded from it outright, so a parked identity behaves
# the same either way.
# oru changes what a track's motion filter believes after a gap: instead of
# correcting the heading it was coasting on, the filter is rebuilt from the two
# real boxes either side of the gap and replayed across it, so what it comes out
# believing is where the object actually went rather than where it was going
# before it vanished. Only gaps between one and ten seconds qualify — under
# that the coast is still close to what it measured, over it a straight line
# between two sightings is a guess of its own — and a stretch the plugin is
# re-reporting a still object through is never one of them. Off by default.
tracking:
  max_unseen_ms: 3000
  max_live_tracks: 128
  stationary_after_ms: 10000
  bbd: false
  oru: false

# Days to keep event clips; per-label overrides win. Track rows keep their own
# clock (tracks_days) and are exempt from emergency disk cleanup.
retention:
  days: 14
  per_label:
    person: 30
  # Days to keep track rows — the log of what was seen, recorded or not. One
  # global clock, no per-camera or per-label form, and far longer than `days`:
  # rows cost hundreds of bytes where clips cost megabytes.
  tracks_days: 365

# Third-party integrations. The Home Assistant API (/api) is disabled unless a
# token is set here; requests must send it as `Authorization: Bearer <token>`
# (or `?access_token=<token>` for media URLs). Generate one with e.g.
# `openssl rand -hex 32`. Leave commented out to keep /api returning 401.
# integrations:
#   token: "replace-with-a-long-random-secret"

# Named plugin groups: one process serves every camera that names it, launched
# with a --cameras-json array of its members instead of the per-camera flags.
# Use this for an accelerator only one process can hold at a time (a Coral Edge
# TPU is the motivating case); otherwise give each camera its own inline
# command below. A group is restarted only when its command, membership, or a
# member's min_score or UDP port changes — never when a member camera stops.
# plugins:
#   detect:
#     # the path to your built binary, resolved from Cairn's own working
#     # directory — not from the plugin's. --labels belongs to the --model
#     # above it: coco.names is the 80-entry list yolox and the Ultralytics
#     # families emit, an rfdetr model needs the 91-entry coco91.names.
#     # cairn-detect refuses to start on a count mismatch rather than emit
#     # every detection under the wrong class name.
#     command: plugins/cairn-detect/target/release/cairn-detect --model yolox_nano.onnx --labels coco.names

cameras: []
#  - id: front_door
#    rtsp_url: rtsp://user:pass@192.168.1.10:554/stream1
#    # Inference plugin. A list, or a string with whitespace, is an inline
#    # command run as this camera's own process; a single whitespace-free
#    # token names a group under `plugins:` above (undefined ⇒ config error).
#    # An inline command of one token must therefore be a one-element list.
#    # Receives RTP on an assigned UDP port, prints ndjson detections on stdout.
#    plugin: ["plugins/cairn-detect/target/release/cairn-detect"]
#    # Three levels of threshold, per label. Each answers a different
#    # question, and they must not fight: effective `record` >= `track` >=
#    # `min_score` for every label, or the config is rejected. "Effective"
#    # is what an omitted `record:` block resolves to — the wire floor, since
#    # without it everything above `min_score` records — so raising `track:`
#    # above that floor with no `record:` block is rejected as well: it would
#    # leave a band that films but is never written down. A label a *present*
#    # `record:` block leaves out is fine; that is rows without video, which
#    # is what these tiers are for.
#    #
#    #   min_score  does the plugin emit the detection at all — the wire
#    #              floor. It reaches the plugin process as argv, so the host
#    #              never sees anything below it and changing it restarts the
#    #              camera. A label under this floor is invisible, which is
#    #              why a `record` below it could only ever fire zero times.
#    #   track      does the detection earn a row in the track log.
#    #   record     does the detection trigger video.
#    #
#    # Unlike `min_score`, the two host-side tiers are applied to a running
#    # camera on Reload: tuning them costs neither the stream nor the live
#    # tracks you are tuning against.
#    #
#    # With the three blocks below: everything above 0.4 reaches the host;
#    # people at 0.4 and cats at 0.5 get track rows; only people, and only at
#    # 0.6, ever start a recording. So cats are logged but never filmed, and
#    # every other COCO class is neither logged nor filmed.
#    min_score:
#      default: 0.4
#      person: 0.4
#    track:
#      person: 0.4
#      cat: 0.5
#    record:
#      # A bare number is shorthand for `{min_score: n}`. The map form is
#      # where per-label filters (area, aspect, zones) will be added, so
#      # writing it today costs nothing and migrates to nothing.
#      person:
#        min_score: 0.6
#    # Omitting `track:` or `record:` entirely is exactly today's behaviour:
#    # everything above `min_score` is tracked and everything above it
#    # records. Once a block is present it is a whitelist — a label with no
#    # entry of its own and no `default:` entry is excluded from that tier.
#    # Add `default: 0.5` inside a block to keep a catch-all. Raising `track:`
#    # is therefore a two-block edit: a `record:` block has to say what films.
#    extra_ffmpeg_args: []
#    # Opt-in hardware transcode for non-H.264 cameras (v4l2m2m only).
#    transcode: false
