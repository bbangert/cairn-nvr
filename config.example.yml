# Cairn NVR configuration — copy to config.yml (or set CAIRN_CONFIG).
# The UI renders this read-only; apply changes via restart or the Reload
# button on /config.

# All mutable state (db, event clips, snapshots, logs) lives here.
# Overridable with the CAIRN_DATA_DIR environment variable.
data_dir: data

# Seconds without a new fragment before a camera is considered stalled
# and its ffmpeg process is bounced.
stall_seconds: 15

# Emergency cleanup: when free space on data_dir drops below this,
# oldest events are deleted regardless of retention.
free_space_min_mb: 2048

# Rewrite each finished clip into a plain mp4 (ffmpeg -c copy, no re-encode).
# Recording writes concatenated fmp4 fragments that carry the camera's absolute
# decode times and declare no duration, so without this a clip reports its
# length as "time since ffmpeg started" — a 60s event two hours in probes as a
# two-hour file — and seeking is meaningless. Costs one extra read+write of the
# clip at finalize. Set false only if minimising disk writes matters more than
# clips knowing how long they are.
remux_clips: true

# Event clip windows (per-camera overridable with the same keys).
events:
  pre_window_seconds: 5
  post_window_seconds: 10
  max_event_seconds: 300

# Object tracking (the three bounds here are per-camera overridable under the
# camera; bbd, oru, ocr and reid are not — see the note under them).
# A track that goes unseen for this much *stream* time is ended — five times
# that while it is stationary, so a parked object outlasts what parks in front
# of it; its object_id (a ULID) is never handed to anything else.
# max_live_tracks caps how many tracks one camera may hold at once — at the cap
# the least recently seen one is retired (end_reason "evicted"), so a scene
# that mints a fresh identity every frame cannot grow the host's state without
# bound.
# stationary_after_ms is how long an object's box must hold still, in stream
# time, before the track is reported as stationary. Leaving that state is
# sustained too, over a fixed couple of seconds that is not configurable: it is
# sized against detector jitter rather than against the scene.
# bbd adds a second admission test to matching: a detection that overlaps a
# track's predicted box not at all may still be matched to it on the distance
# between their centres, scaled by the box's size and by how long the track has
# gone unmatched. What it buys is a moving object that vanishes for longer than
# it takes to clear its own width — beyond that, overlap is zero for the right
# detection and the wrong one alike. It is off by default because widening what
# a track will answer to is also how an identity goes to the wrong object; a
# stationary track is excluded from it outright, so a parked identity behaves
# the same either way.
# oru changes what a track's motion filter believes after a gap: instead of
# correcting the heading it was coasting on, the filter is rebuilt from the two
# real boxes either side of the gap and replayed across it, so what it comes out
# believing is where the object actually went rather than where it was going
# before it vanished. Only gaps between one and ten seconds qualify — under
# that the coast is still close to what it measured, over it a straight line
# between two sightings is a guess of its own — and a stretch the detector is
# re-reporting a still object through is never one of them. Off by default.
# ocr (observation-centric recovery) runs after both association passes and
# bbd: a live coasted track is offered against whatever detections are still
# unmatched using its last observed box, not its Kalman prediction — the
# recovery a mover that pauses behind an occluder and reappears where it
# vanished needs, since its prediction has since drifted off that spot. A
# stationary track is excluded, for bbd's reason. Off by default.
# reid fuses appearance into matching: with the engine's embedder running, a
# person detection's embedding (carried on the observation but only used if
# this is on) feeds a rolling per-track appearance, and the bbd admission
# gains an appearance veto and a cost tiebreak from it. Its only seam into the tracker
# is that admission, so reid: true requires bbd: true — config load refuses
# the combination of reid: true with bbd: false rather than accept a flag that
# can never act. Off by default: the fusion is unmeasured until phase-6 E2E
# and its veto threshold is provisional until then.
#
# None of the four has a per-camera form: they describe the matcher and the
# motion filter rather than a scene, so they are one answer for every camera
# that is not covered by a hardware profile. A profile is the other way to
# answer bbd, oru and ocr — per plugin group, i.e. per piece of hardware — and
# for the cameras on a profiled group those three keys are ignored entirely,
# with a warning at load saying the profile won. reid does not have a profile
# form yet and is not superseded by one — it keeps applying to a profiled
# camera too, for whatever bbd the group's own stage list leaves it (a load
# warning names a profiled group whose stage list leaves bbd out, since reid
# does nothing there either). See docs/profile-authoring.md; profiles are the
# migration target for bbd/oru/ocr, and there is no deadline.
tracking:
  max_unseen_ms: 3000
  max_live_tracks: 128
  stationary_after_ms: 10000
  # Which tracker the detect branch hosts. "cairn" is this codebase's own;
  # "sparsetrack" is the port of the vendored SparseTrack reference, parity-
  # gated against it on MOT sequences and measured nowhere else yet, which is
  # why it is selectable but not the default. Camera > profile > global.
  tracker: cairn
  bbd: false
  oru: false
  ocr: false
  reid: false

# Days to keep event clips; per-label overrides win. Track rows keep their own
# clock (tracks_days) and are exempt from emergency disk cleanup.
retention:
  days: 14
  per_label:
    person: 30
  # Days to keep track rows — the log of what was seen, recorded or not. One
  # global clock, no per-camera or per-label form, and far longer than `days`:
  # rows cost hundreds of bytes where clips cost megabytes.
  tracks_days: 365

# Third-party integrations. The Home Assistant API (/api) is disabled unless a
# token is set here; requests must send it as `Authorization: Bearer <token>`
# (or `?access_token=<token>` for media URLs). Generate one with e.g.
# `openssl rand -hex 32`. Leave commented out to keep /api returning 401.
# integrations:
#   token: "replace-with-a-long-random-secret"

# Directories holding your own hardware profiles (docs/profile-authoring.md).
# The profiles cairn ships (priv/profiles/) are always loaded first and these
# are loaded after, so a file of yours shadows a shipped one of the same name —
# with a warning naming the file that won. Omit the key entirely to use only
# the shipped ones.
# profile_dirs:
#   - /etc/cairn/profiles

# Named plugin groups: the profile whose model this node's own engine loads
# for every camera that names the group. Detection runs in the VM (one engine,
# one model per node — groups naming different models fail the load), so a
# group is nothing but that profile reference plus your consent flags.
# plugins:
#   detect:
#     # A filename under priv/profiles/ or a profile_dirs entry, without .yml.
#     # The profile names the model, the family, the input size, the labels
#     # and the inference backend — and the tracker stages that go with them,
#     # for every camera on this group.
#     profile: generic-ort
#
#   npu:
#     profile: rk3566-lowfps
#     # Required to run a profile whose backend is not `ort`: only `ort`
#     # executes today. Both halves are needed — the profile declares
#     # `experimental: true`, this key is your consent to it.
#     allow_experimental: true

cameras: []
#  - id: front_door
#    rtsp_url: rtsp://user:pass@192.168.1.10:554/stream1
#    # The camera's second, low-resolution stream: detection runs on it while
#    # recording, snapshots and event clips keep cutting from the main stream
#    # above — the detector gets frames it does not have to downscale, and the
#    # main stream is decoded for the ring alone. Optional; absent ⇒ detection
#    # taps the main stream, exactly as before.
#    #
#    # Always rtsp://, whatever `ingest` the main stream uses: cairn reads the
#    # sub natively even where main rides the ffmpeg bridge. The two streams
#    # MUST share an aspect ratio (1920x1080 main with a 640x360 sub is fine,
#    # 640x480 is not): boxes are normalized against the frame that produced
#    # them and are drawn on artifacts cut from the main stream, so a
#    # differently framed sub puts every box in the wrong place.
#    substream_url: rtsp://user:pass@192.168.1.10:554/stream2
#    # Detection: names a group under `plugins:` above (undefined ⇒ config
#    # error), whose profile picks the model this node's engine runs for the
#    # camera. Absent ⇒ no detection. The pre-phase-6 inline-command form is
#    # refused with the migration spelled out.
#    plugin: detect
#    # The motion gate's scene config, verbatim JSON — zones and thresholds
#    # describe THIS scene, so the knob is the camera's, never a profile's
#    # (D-P6). It must say "enabled": true or no gate is built (the load
#    # warns). Rejected on a tier-2 group: that tier claims accurate MOT,
#    # and a gate starves the tracker of the frames it skips. Absent ⇒ no
#    # gate, today's chain exactly. Vocabulary: docs/profile-authoring.md
#    # and plugins/cairn-detect/src/motion.rs.
#    motion_json: '{"enabled": true, "threshold": 30}'
#    # Three levels of threshold, per label. Each answers a different
#    # question, and they must not fight: effective `record` >= `track` >=
#    # `min_score` for every label, or the config is rejected. "Effective"
#    # is what an omitted `record:` block resolves to — the wire floor, since
#    # without it everything above `min_score` records — so raising `track:`
#    # above that floor with no `record:` block is rejected as well: it would
#    # leave a band that films but is never written down. A label a *present*
#    # `record:` block leaves out is fine; that is rows without video, which
#    # is what these tiers are for.
#    #
#    #   min_score  does the engine emit the detection at all — the wire
#    #              floor. It reaches the engine as the stream's params at
#    #              session start, so the tracker never sees anything below
#    #              it and changing it restarts the camera. A label under
#    #              this floor is invisible, which is why a `record` below
#    #              it could only ever fire zero times.
#    #   track      does the detection earn a row in the track log.
#    #   record     does the detection trigger video.
#    #
#    # Unlike `min_score`, the two host-side tiers are applied to a running
#    # camera on Reload: tuning them costs neither the stream nor the live
#    # tracks you are tuning against.
#    #
#    # With the three blocks below: everything above 0.4 reaches the host;
#    # people at 0.4 and cats at 0.5 get track rows; only people, and only at
#    # 0.6, ever start a recording. So cats are logged but never filmed, and
#    # every other COCO class is neither logged nor filmed.
#    min_score:
#      default: 0.4
#      person: 0.4
#    track:
#      person: 0.4
#      cat: 0.5
#    record:
#      # A bare number is shorthand for `{min_score: n}`. The map form is
#      # where per-label filters (area, aspect, zones) will be added, so
#      # writing it today costs nothing and migrates to nothing.
#      person:
#        min_score: 0.6
#    # Omitting `track:` or `record:` entirely is exactly today's behaviour:
#    # everything above `min_score` is tracked and everything above it
#    # records. Once a block is present it is a whitelist — a label with no
#    # entry of its own and no `default:` entry is excluded from that tier.
#    # Add `default: 0.5` inside a block to keep a catch-all. Raising `track:`
#    # is therefore a two-block edit: a `record:` block has to say what films.
#    extra_ffmpeg_args: []
#    # Opt-in hardware transcode for non-H.264 cameras (v4l2m2m only).
#    transcode: false
#    retention:
#      days: 7
