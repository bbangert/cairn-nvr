[package]
name = "cairn-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "cairn_native"
# The BEAM dlopens one shared object; nothing links this crate at build time.
# The clip harness lives inside the crate (`src/clip.rs`) rather than under
# `tests/` for the same reason — there is no rlib for an integration test to
# link, and the stages it drives are crate-private on purpose.
crate-type = ["cdylib"]

[dependencies]
# The decode stages — decode, resize, motion measurement. A path dependency on
# the plugin's library target rather than a copy: the plugin and the NIF
# disagreeing about what a frame means is the failure this whole crate is
# shaped to avoid. The inference stages live behind `cairn-ort`, the other
# half of the split boundary; the two share no code above cairn-detect and no
# resource at runtime.
cairn-detect = { path = "../cairn-detect" }
rustler = { version = "0.38", features = ["derive"] }
# Must match cairn-detect's feature selection exactly: rusty_ffmpeg's bindings
# are generated per feature, and two crates asking for different ones do not
# link.
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg7_1"] }
anyhow = "1.0"
# For `ValueEnum::from_str` on `DecoderKind`, the plugin's clap enum: the
# params the host sends name the same values the operator's `--decoder` flag
# does, parsed by the same code.
clap = { version = "4.5", default-features = false, features = ["std"] }

[dev-dependencies]
# The clip harness drives both halves of the split boundary — this decode
# library and the inference one — through one end-to-end test; `test-hooks`
# exposes cairn-ort's panic/poison arming to it.
cairn-ort = { path = "../cairn-ort", features = ["test-hooks"] }

[profile.release]
lto = "thin"
strip = true
