[package]
name = "cairn-ort"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# `cdylib` is the NIF library the BEAM loads as `CairnOrt`. The `rlib` has two
# consumers: cairn-native's dev-dependency, whose clip harness drives both
# halves of the split boundary through one end-to-end test, and the Rockchip
# board crate, which hosts this engine over its own backend under its own NIF
# module (`default-features = false`).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The inference stages — model session (ort/qnn backends, our own in-tree
# `ort` pin, D-C1), heads/NMS, Re-ID embedding, labels. A path dependency on
# the plugin's library target rather than a copy: the plugin binary, the
# decode NIF and this library disagreeing about what a detection means is the
# failure this shape avoids.
cairn-detect = { path = "../cairn-detect" }
rustler = { version = "0.38", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["nif"]
# `CairnOrt`'s NIF functions and `rustler::init!`. rustler collects every
# `#[rustler::nif]` in the final binary into whichever `init!` that binary
# runs, so a crate linking this one under its own NIF module turns this off;
# the resource types and everything a NIF body calls stay public without it.
nif = []
# Passed through to cairn-detect for container builds, on both arches, which
# dlopen the pinned base ORT at `ORT_DYLIB_PATH` instead of statically linking
# it.
ort-load-dynamic = ["cairn-detect/ort-load-dynamic"]
# Exposes the panic/poison test hooks to another crate's test build —
# cairn-native's clip harness drives both halves of the split boundary and
# needs to arm faults here. Never enabled by a production build: only
# cairn-native's dev-dependency asks for it.
test-hooks = []

[profile.release]
lto = "thin"
strip = true
