[package]
name = "cairn-detect"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# rsmpeg 0.18 defaults to the ffmpeg8 bindings; the dev/CI toolchain ships
# FFmpeg 7.1, and the feature must match the headers rusty_ffmpeg binds against.
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg7_1"] }
ort = "=2.0.0-rc.12"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
anyhow = "1.0"
# For `_exit` only: see `control::spawn_reader`. Already in the lock file
# transitively, so this adds no compilation.
libc = "0.2"
# Typed errors for `infer::resolve`; `anyhow` still owns everything above it.
thiserror = "2.0"

[features]
# Board (aarch64) builds: dlopen libonnxruntime.so at runtime (`ORT_DYLIB_PATH`)
# instead of statically linking ort's downloaded x86 archive. What ships to the
# board is then the exact base ORT the QNN spike proved against the plugin EP
# (`tools/qnn-spike/README.md`'s version triple), and cross-linking needs no
# ORT libs at all. Dev and CI builds stay on the default static link — the QNN
# code paths compile either way.
ort-load-dynamic = ["ort/load-dynamic"]

[profile.release]
lto = "thin"
# Most of the binary is the statically linked onnxruntime; its debug info is
# dead weight in a plugin whose only diagnostics are stderr lines.
strip = true

[dev-dependencies]
# One compile-fail case, `tests/norm_box_invariant.rs`: `NormBox`'s field
# privacy is a build-time guarantee and a `#[test]` cannot observe it. Not a
# doctest, because this crate has no library target and doctests never run.
trybuild = "1.0.118"
