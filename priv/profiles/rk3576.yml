# Rockchip RK3576 (6 TOPS, INT4-capable) — rk3566-lowfps's pipeline with room
# to run it faster.
#
# experimental: true on both of rk3566-lowfps's counts: the `rknn` backend is a
# stub (a group naming this profile also needs `allow_experimental: true`), and
# no source read here documents converting the yolox family with rknn-toolkit2.
experimental: true
backend: rknn
model:
  # Compiled for this board — see rk3566-lowfps.yml on why the artifact is a
  # different file and why `input_size:` has to match the geometry it was
  # compiled at.
  rknn: models/yolox_nano_rk3576.rknn
model_profile: yolox
input_size: 416
# No `decoder:` here, deliberately, where qcs6490.yml names one. This board's
# merged mainline decode (`rkvdec` VDPU383, kernel 7.0+) is a V4L2 *stateless*
# device driven through the request API, and the `v4l2` menu entry selects
# ffmpeg's `h264_v4l2m2m` — the stateful M2M decoder, a different interface.
# Which value is right here, and whether the board's ffmpeg build reaches its
# decoder at all, is spike 0.4's on-board checklist item 3 and cannot be settled
# from a desk. `auto` probes v4l2 and falls back to software, which is the honest
# behaviour until someone runs it.
labels: models/coco.names
# Declared, pending on-hardware measurement — and the weakest number cairn
# ships. `docs/npu-backends.md` found no official benchmark for this NPU at
# all: 8-16 is the rk3566 figures scaled by roughly the TOPS ratio, and nothing
# more. **Unmeasured.** Bands are data; correcting this one is a file edit and
# no code change.
fps_band: [8, 16]
tracking:
  # The same stage set as rk3566-lowfps. 8-16 fps is faster, not fast: the gaps
  # `bbd` and `oru` address are still wide in frames at this rate, and nothing
  # measured on this board says otherwise — there is nothing measured on this
  # board at all. Same operator pairing applies: `bbd` wants the plugin's
  # `--track-floor-json` set in the group's `command:` (D-P6).
  bbd: true
  oru: true
  twin_mint: true
  max_unseen_ms: 3000
  max_live_tracks: 128
  stationary_after_ms: 10000
