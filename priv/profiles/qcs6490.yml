# Qualcomm QCS6490 — the Hexagon HTP through onnxruntime's QNN execution
# provider.
#
# experimental: true because the `qnn` backend does not execute yet (D-P10): a
# group naming this profile also needs `allow_experimental: true`. The name
# parses on both sides of the boundary precisely so a board profile can be
# written and validated before its runtime lands.
experimental: true
backend: qnn
model:
  # A QDQ-quantized graph (uint16 activations / uint8 weights, produced by the
  # onnxruntime quantization API or AIMET). Still an `.onnx` by format — QNN is
  # an onnxruntime execution provider, not a separate runtime — but a different
  # *file* from the fp32 export, which is why the schema keys it under `qnn:`
  # of its own. Placeholder path, as in every shipped profile.
  qnn: models/yolov10n_qdq.onnx
# NMS-free by requirement rather than by taste: the NMS operator is not in
# QNN's supported op list, so an export with suppression fused into the graph
# is declined by the provider. yolov10's end-to-end head needs no suppression
# at all. A family cairn decodes with host-side NMS (yolox, yolov8) would be
# legal here too — that suppression runs on the CPU whatever executed the model
# — which is exactly what the capability table's first rule says.
model_profile: yolov10
input_size: 640
# Venus, through ffmpeg's `h264_v4l2m2m`. The one decode field cairn ships with a
# measurement behind it rather than a declaration: spike 0.3 decoded the live
# fleet concurrently on this ASIC at 59 and 47 fps for about 2% CPU, against
# roughly 30% of a core per camera in software. Named rather than left at `auto`
# because on a membrane camera a named decoder is a requirement — if Venus is not
# there, detection stops and says so, instead of quietly eating the CPU the model
# needs. `auto` would reach the same decoder on this board (aarch64 Linux probes
# v4l2 and nothing else); what it would not do is notice its absence.
decoder: v4l2
labels: models/coco.names
# Measured on-board (.58, 2026-08-11, task 5.5 — the capacity ladder and fps
# sweep in membrane-port/research/fps-accuracy-sweep.md), replacing the
# vendor-optimistic [15, 30] this file shipped with. The floor is the Tier-2
# requirement: static-camera tracking accuracy is flat from native rates down
# to 5 fps (MOT20/PP22 tracker-only sweep), so nothing above 5 buys accuracy.
# The ceiling is NPU arithmetic with the Tier-2 detector class (yolo26s-qdq,
# ~37 ms/pass on HTP → ~26 passes/s): a half-occupied box (2 cameras)
# sustains ~10 fps each; at the box's full 4-camera occupancy, 5 fps each is
# already ~75% of the session. The binding capacity limit is not fps at all —
# it is Venus: 4 concurrent 5 MP@20fps decode sessions, and the 5th session
# opens and then decodes NOTHING (whole-session starvation, caught by the
# decoder's 400-AU tripwire). Count pixel rate before adding cameras.
fps_band: [5, 10]
tracking:
  # This block *is* the stage list, and it lists nothing: a `tracking:` block
  # that is present — even holding only bounds, like this one — engages
  # presence semantics, so every stage is delisted here, `twin_mint` included,
  # which the other three shipped profiles all turn on. (Omitting the block
  # entirely would instead say nothing about tracking and leave the camera's
  # boolean flags standing.)
  #
  # That is D-P8's rule for an NMS-free profile, and it is a decision rather
  # than a measurement. The tension is worth stating in the file it applies to:
  # the twin gate exists *because* an NMS-free head slipped an IoU-0.985 double
  # box at cold start (PR #68),
  # and the same redundant band boxes are also what makes a genuinely close
  # same-label pair common enough for the gate to eat a real object. Nothing
  # has measured which way that falls on this hardware. If a deployment here
  # reports "the same car twice", add `twin_mint: true` — one line, and it is
  # what every other profile runs.
  #
  # `bbd` and `oru` are absent for the ordinary reason: they are opt-in stages,
  # and nobody has measured either on this board.
  max_unseen_ms: 3000
  max_live_tracks: 128
  stationary_after_ms: 10000
