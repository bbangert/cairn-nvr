# The baseline profile: detection on the CPU, with nothing opt-in.
#
# A group on this profile runs yolox at 416 on onnxruntime's CPU provider, the
# cold-start twin gate on, and none of the opt-in association/filter/recovery
# stages. Its `tracking:` block is the stage list, so the global
# `tracking.bbd`/`oru`/`ocr` booleans do not reach its cameras; see
# `docs/profile-authoring.md` for turning those stages on in a copy.
#
# The one shipped profile that is not experimental: `ort` is the backend that
# executes today, and this file names no combination the capability table
# refuses.
experimental: false
backend: ort
model:
  # Placeholder paths, and deliberately so: a profile's files are checked
  # against the disk only for a group that actually runs it, so this file costs
  # a node nothing until it is named. Point it at your own artifacts, or copy
  # it into a `profile_dirs:` entry under a name of your own.
  onnx: models/yolox_nano.onnx
model_profile: yolox
input_size: 416
labels: models/coco.names
# Declared, pending on-hardware measurement. With no `sample_fps:` the decode
# gate samples at the default 5 fps (`Cairn.Native.Config`), so that is the rate
# frames reach the model at; whether a given host's CPU keeps up with it is the
# unmeasured half, and it is the half a band is supposed to describe.
fps_band: [5, 5]
tracking:
  # Presence, not defaults: this block *is* the stage list. `twin_mint` alone
  # is the pre-profile behaviour (D-P8) — `bbd` and `oru` ship off, and the
  # baseline lists neither. Adding them is a per-profile decision — see
  # docs/profile-authoring.md on each stage — and note that bbd's measured
  # win needs the engine's track floor (`track_floor_json`) alongside it,
  # which no config key sets yet.
  twin_mint: true
  # The global defaults, restated.
  max_unseen_ms: 3000
  max_live_tracks: 128
  stationary_after_ms: 10000
