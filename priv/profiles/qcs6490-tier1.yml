# DRAFT: yolox_m's budget is menu-arithmetic, not boundary-measured — its
# ladder run is owed (D-L6). tiny and nano remain measured.
#
# Qualcomm QCS6490, tier 1 (presence detection) — the model-ladder profile.
#
# ONE ladder for every installation state: the yolo26 rungs (AGPL —
# distributed as cairn-models packs into the data dir, never baked into the
# image) sit above the Apache rungs the image carries. Resolution takes the
# most accurate INSTALLED rung whose budget covers the fleet, so with the
# packs present yolox_m is shadowed by yolo26s (which dominates it — same
# accuracy, lower latency, model-menu-htp 2026-08-14) and never wins; with
# only the baked Apache models, yolox_m carries small fleets at 46.9 paper
# mAP instead of falling to tiny's 32.8. That state-dependence is why its
# budget may sit below yolo26s's: the reachability rule requires only that
# no ALWAYS-PRESENT rung above it has at least its budget.
#
# The ladder replaces a fixed model choice: config resolves, per load, the
# most accurate rung whose measured engine budget covers the configured
# fleet at tier 1's 2 fps floor (1.875/s effective on the 15 fps substream
# grid), and derives every camera's sample_fps from the winning rung. Order
# is paper-mAP, best first; budgets are passes/s on this board's HTP.
#
# The capacity claim is dual-stream ONLY: detection reads the substream, and
# single-stream the 5 MP Venus decode wall returns at ~4 cameras. It is also
# the motion-gate-open worst case — the tier-1 capacity cells ran ungated,
# so the gate buys power/thermal headroom, never extra cameras.
#
# experimental: true because qnn has not soaked (D-P10): a group naming this
# profile also needs `allow_experimental: true`.
experimental: true
tier: 1
backend: qnn
model_ladder:
  # provisional budget: menu bench p50 58.2 ms + ~1.3 ms serialization
  # (model-menu-htp 2026-08-14) — boundary ladder run owed (D-L6).
  - model:
      qnn: data/models/yolo26m-qdq.onnx
    model_profile: yolo26
    input_size: 640
    engine_budget: 16.8
    pack: yolo26m
  # provisional budget: menu bench p50 37.4 ms + serialization (2026-08-07
  # bench, same board) — boundary ladder run owed.
  - model:
      qnn: data/models/yolo26s-qdq.onnx
    model_profile: yolo26
    input_size: 640
    engine_budget: 25.8
    pack: yolo26s
  # The best accuracy the image itself carries (46.9 paper mAP, Apache).
  # Wins exactly when the yolo26 packs above are absent and the fleet is
  # small (≤10 at the floor); dominated by an installed yolo26s otherwise.
  # provisional budget: menu bench p50 48.5 ms + serialization
  # (model-menu-htp 2026-08-14) — boundary ladder run owed (D-L6).
  - model:
      qnn: models/yolox_m_qdq.onnx
    model_profile: yolox
    input_size: 640
    engine_budget: 20
  # provisional budget: menu bench p50 17.7 ms + serialization (2026-08-14).
  # Known recall flag: the 416 export's verify scores cluster at 0.506–0.513
  # against the 0.5 floor — re-verify on real camera frames before leaning
  # on this rung (model-menu-htp "reads").
  - model:
      qnn: data/models/yolo26n-416-qdq.onnx
    model_profile: yolo26
    input_size: 416
    engine_budget: 52.6
    pack: yolo26n-416
  # measured budget: boundary ladder 2026-08-15 — 36 cameras at the
  # 1.875/s effective floor (67.5 passes/s) delivered 100% uniform ×2;
  # ceiling onset at 38 (98.8%, CPU dropping — engine-bound). The menu
  # arithmetic (17.0 ms p50 → 54.6/s) ran 24% low: sustained HTP
  # throughput beats single-camera bench p50 by a model-dependent margin
  # (nano's gap was only ~4%), which is why budgets are ladder-measured,
  # never bench-derived. Evidence: tier1-boundary-20260815.
  - model:
      qnn: models/yolox_tiny_qdq.onnx
    model_profile: yolox
    input_size: 416
    engine_budget: 67.5
  # measured budget: tier1-capacity ladder 2026-08-14 — 40 cameras at the
  # 1.875/s effective floor (= 75.0 passes/s) delivered 100% in three runs;
  # 44 showed ceiling onset. The engine path, not decode or RSS, binds.
  # Re-confirmed 2026-08-15 through the shipped ladder's own resolution
  # (tier1-boundary findings, task 3.2).
  - model:
      qnn: models/yolox_nano_qdq.onnx
    model_profile: yolox
    input_size: 416
    engine_budget: 75
# The support claim, enforced as a bound: 40 is yolox_nano's measured reach
# at the tier-1 floor (tier1-capacity 2026-08-14, host-side; container
# parity re-check owed per qcs6490-profiles D-P2/D-P3). A larger fleet is
# refused at load even though it is also past every budget.
supported_cameras: 40
# Venus, through ffmpeg's h264_v4l2m2m — the one decode field cairn ships
# with a measurement behind it (spike 0.3: the live fleet concurrently at
# 59 and 47 fps for ~2% CPU, vs ~30% of a core per camera in software).
# Named rather than left at `auto` because on a membrane camera a named
# decoder is a requirement: if Venus is not there, detection stops and says
# so instead of quietly eating the CPU the models need. At substream
# resolution decode never binds (~6.3%/cam CPU in the capacity cells).
decoder: v4l2
labels: models/coco.names
# No tracking block, and none would be legal: tier 1 is presence detection
# and its pipeline runs no tracker — config refuses a tier-1 profile that
# says otherwise.
