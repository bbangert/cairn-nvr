name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  ci:
    name: Compile · Format · Credo · Sobelow · Dialyzer · Test
    runs-on: ubuntu-latest
    # Elixir only. The Rust plugin is a separate crate with its own toolchain
    # and its own gates — see the `cairn-detect` job below.

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "28"

      # the test suite drives real ffmpeg/ffprobe (fixtures, probe, e2e)
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

      - run: mix credo

      # Config.HTTPS ignored deliberately: cairn's v1 posture is LAN-trusted
      # plain http with no TLS terminator anywhere in the deployment, and
      # force_ssl 301'd the vagus panel's webui link into a listener that
      # doesn't exist (device-proven on the Q6A).
      - run: mix sobelow --skip --exit --threshold medium --ignore Config.HTTPS

      - run: mix dialyzer --format github

      - run: mix test

      - name: Full-pipeline integration test (real ffmpeg)
        run: mix test --only integration

  cairn-detect:
    name: Rust · Format · Clippy · Test · Release build
    runs-on: ubuntu-latest
    # Debian 13 (trixie) ships FFmpeg 7.1, which is what rsmpeg's `ffmpeg7_1`
    # feature binds against — the runner image's own Ubuntu 24.04 ships 6.1 and
    # would need a different feature. It is also one of the two targets
    # plugins/cairn-detect/README.md documents as "builds as-is", so this job
    # doubles as a check that those instructions still work. glibc 2.41 here is
    # past onnxruntime's 2.38 requirement, so src/glibc_compat.rs stays inert.
    container: debian:13

    env:
      # Both overrides are mandatory outside the dev container:
      # .cargo/config.toml pins FFMPEG_PKG_CONFIG_PATH at /opt/ffmpeg7 (and the
      # build panics when that is absent) and bakes an rpath to it. Cargo's
      # [env] does not override a value already in the environment, and
      # RUSTFLAGS wins over [build] rustflags — so setting both here leaves the
      # dev loop untouched. Same pair the README gives for a fresh Debian 13.
      FFMPEG_PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
      RUSTFLAGS: ""
      CARGO_TERM_COLOR: always

    steps:
      # All eight libav*/libsw*/libpostproc dev packages, not just the five the
      # crate names: rusty_ffmpeg's build script pkg-configs the whole FFmpeg
      # library set, so one missing .pc fails the build even though nothing
      # here calls into it.
      #
      # libssl-dev is not obvious and not optional: ort-sys's *build script*
      # fetches the prebuilt onnxruntime over TLS via ureq -> native-tls ->
      # openssl-sys, so a missing libssl-dev fails the build before any of
      # this crate compiles. It is present in the dev container only because
      # the Dockerfile installs it for kerl.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libpostproc-dev libswresample-dev libswscale-dev \
            libssl-dev \
            curl ca-certificates git

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ort downloads a ~90 MB prebuilt static onnxruntime on a cold build.
      - name: Cache cargo registry, target and the onnxruntime download
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            plugins/cairn-detect/target
            plugins/cairn-native/target
            plugins/cairn-ort/target
          key: cargo-debian13-${{ hashFiles('plugins/*/Cargo.lock') }}
          restore-keys: |
            cargo-debian13-

      # working-directory is set per step rather than as a job default: the apt
      # step above runs before checkout, when plugins/cairn-detect does not yet
      # exist and a job-wide default would fail it.
      - run: cargo fmt --check
        working-directory: plugins/cairn-detect

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-detect

      # Includes the composed-tail tests in src/infer/heads.rs, which pin a
      # whole decoded `Vec<Det>` per head per projection. They replaced the
      # checked-in golden fixtures the infer.rs refactor was built on: the
      # coverage stayed, the re-record-on-red machinery did not.
      #
      # Also runs tests/norm_box_invariant.rs, the trybuild compile-fail case
      # that guards NormBox's private field. It needs no step of its own, but it
      # does need a warm ~/.cargo/registry: trybuild builds a scratch crate under
      # target/tests/trybuild and runs a second cargo over it with --offline. The
      # generated manifest carries no dev-dependencies of its own, so what has to
      # be present is only what the case itself compiles — which the
      # `cargo clippy --all-targets` step above has already fetched. Verified by
      # deleting target/tests/trybuild and re-running with this job's env.
      - run: cargo test
        working-directory: plugins/cairn-detect

      - run: cargo build --release
        working-directory: plugins/cairn-detect

      # Broken intra-doc links are a *rustdoc* lint, so clippy and
      # -D warnings cannot see them — the module split in #22 broke twelve of
      # them with every other gate green. --document-private-items because
      # this is a binary crate: the docs exist for maintainers, and every
      # cross-module reference in `infer` points at a private item.
      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-detect
        env:
          RUSTDOCFLAGS: -D warnings

      # The two NIF crates, same gates. Their end-to-end clip tests need model
      # artifacts CI does not carry, and the harness's sanctioned waiver is the
      # env var — a test that silently skipped would be indistinguishable from
      # one that passed, so the waiver has to be explicit here.
      - run: cargo fmt --check
        working-directory: plugins/cairn-native

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-native

      - run: cargo test
        working-directory: plugins/cairn-native
        env:
          CAIRN_NATIVE_SKIP_CLIP: "1"

      - run: cargo build --release
        working-directory: plugins/cairn-native

      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-native
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo fmt --check
        working-directory: plugins/cairn-ort

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-ort

      - run: cargo test
        working-directory: plugins/cairn-ort

      - run: cargo build --release
        working-directory: plugins/cairn-ort

      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-ort
        env:
          RUSTDOCFLAGS: -D warnings
