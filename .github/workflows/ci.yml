name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  compile:
    name: Compile · Format
    runs-on: ubuntu-latest
    # Elixir gates run as parallel jobs below, each with its own cache key.
    # The Rust crates have their own toolchain and their own gates — see the
    # `cairn-detect` job below.
    #
    # Every setup-beam step installs the exact versions in mise.toml, so a
    # toolchain move is one edit there plus the Dockerfile's ARGs.

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Toolchain matches the image
        run: tools/ci/check-toolchain.sh

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-compile-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-compile-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-credo-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-credo-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix credo --strict

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-sobelow-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-sobelow-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Config.HTTPS ignored deliberately: cairn's v1 posture is LAN-trusted
      # plain http with no TLS terminator anywhere in the deployment, and
      # force_ssl 301'd the vagus panel's webui link into a listener that
      # doesn't exist (device-proven on the Q6A).
      - run: mix sobelow --private --skip --exit --threshold medium --ignore Config.HTTPS

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix dialyzer --format github

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      # the test suite drives real ffmpeg/ffprobe (fixtures, probe, e2e)
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix test

      - name: Full-pipeline integration test (real ffmpeg)
        run: mix test --only integration

  board-loader:
    name: Board loader (prod release + fixture board)
    runs-on: ubuntu-latest
    # The prod release booted with test/fixture_board attached from a board
    # directory, for what only a release shows: embedded loading, the
    # release's copy of an application winning over the directory's, the
    # board application starting inside :cairn's start, and what a refused
    # boot prints. Then the suite that needs a board attached.

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps, build and the fixture NIF's crates
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
          key: mix-board-loader-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock', 'test/fixture_board/native/cairn_fixture_board/Cargo.lock') }}
          restore-keys: |
            mix-board-loader-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: tools/ci/board-boot-test.sh
        env:
          WORK: ${{ runner.temp }}/board-boot

      - run: mix test --only fixture_board test/cairn/fixture_board_test.exs
        env:
          CAIRN_FIXTURE_BOARD_DIR: ${{ runner.temp }}/board-boot/board

  external-board:
    name: External board (core by git ref, booted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # test/fixture_board copied out of the tree and built as a board in
    # another repository would be: cairn_stage as a sparse Mix git
    # dependency on this checkout, cairn-detect and cairn-ort as Cargo git
    # dependencies resolving to one copy each, then booted on the prod
    # release. Its own job, not board-loader's steps, so branch protection
    # can require it by name; the price is a second release build.

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      # Not ~/.cargo/git: what it would hold is this commit's checkout.
      - name: Cache deps, build and the crates.io index and crates
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
          key: mix-external-board-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock', 'plugins/*/Cargo.lock', 'test/fixture_board/native/cairn_fixture_board/Cargo.lock') }}
          restore-keys: |
            mix-external-board-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: tools/ci/external-board-test.sh
        env:
          WORK: ${{ runner.temp }}/external-board

  audit:
    name: Hex audit · Unused deps
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-audit-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-audit-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix hex.audit

      - run: mix deps.unlock --check-unused

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-argus-u2404-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-argus-u2404-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Compile first so build output never mixes into the JSON report.
      - run: mix compile

      # No file-level ignores: every finding must be fixed or carry a reviewed
      # entry in .argus-baseline.exs (see scripts/argus_baseline.exs).
      - run: mix argus --format json > argus.json

      - run: elixir scripts/argus_baseline.exs --self-test

      - run: elixir scripts/argus_baseline.exs argus.json .argus-baseline.exs

  campaign-driver:
    name: HTP campaign driver (mix test)
    runs-on: ubuntu-latest
    # Standalone mix project, no deps: the :peer suite exercises real
    # distribution locally (test_helper starts epmd + a longnames node
    # on 127.0.0.1), the stage suite runs against a scripted board.
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: mise.toml
          version-type: strict

      - run: mix compile --warnings-as-errors
        working-directory: tools/qdq-export/driver

      - run: mix format --check-formatted
        working-directory: tools/qdq-export/driver

      - run: mix test
        working-directory: tools/qdq-export/driver

  cairn-stage:
    name: Stage contract library (mix test)
    runs-on: ubuntu-latest
    # The library boards build against, so it must also build on its own
    # rather than only as the base's path dependency.
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: mise.toml
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            libs/cairn_stage/deps
            libs/cairn_stage/_build
          key: mix-cairn-stage-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('libs/cairn_stage/mix.lock') }}
          restore-keys: |
            mix-cairn-stage-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get
        working-directory: libs/cairn_stage

      - run: mix format --check-formatted
        working-directory: libs/cairn_stage

      - run: mix compile --warnings-as-errors
        working-directory: libs/cairn_stage

      - run: mix test
        working-directory: libs/cairn_stage

  release-toolchain:
    name: Release toolchain image
    runs-on: ubuntu-latest
    # The hexpm image the Dockerfile builds the release in, named from its
    # ARGs, so rockchip-board runs in it without a second copy of the
    # versions.
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: image
        run: |
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          echo "image=hexpm/elixir:$(arg ELIXIR_VERSION)-erlang-$(arg OTP_VERSION)-debian-$(arg DEBIAN_TAG)" >> "$GITHUB_OUTPUT"

  rockchip-board:
    name: Rockchip board (mix test, dialyzer, board directory booted)
    needs: release-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # tools/ci/rockchip-board-test.sh: the board built alone, NIF included,
    # as a board directory against the prod release's cairn.rel, and booted
    # on that release; then the base's suite that needs that directory
    # attached, and the board's own suite, built without the base, after the
    # script so that its NIF tests find the library it left in priv/native.
    # No sobelow: the board is not a Phoenix application. In the image the
    # Dockerfile builds the release and the board in, not on setup-beam: it
    # is Debian 13, whose FFmpeg 7.1 the NIF links (the runner's Ubuntu ships
    # 6.1).
    container: ${{ needs.release-toolchain.outputs.image }}
    env:
      # As in the cairn-detect job: the crate's cargo config points at a
      # dev-container /opt/ffmpeg7.
      FFMPEG_PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
      RUSTFLAGS: ""
      CARGO_TERM_COLOR: always
      LC_ALL: C.UTF-8

    steps:
      # git before checkout, which otherwise downloads a tarball; the rest as
      # the release-build stage and the cairn-detect job need them.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential git pkg-config libssl-dev clang libclang-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libpostproc-dev libswresample-dev libswscale-dev \
            curl ca-certificates

      - uses: actions/checkout@v7

      - name: Install Rust and Mix's package managers
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          mix local.hex --force
          mix local.rebar --force

      - name: Cache deps, builds, cargo and the onnxruntime download
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            boards/cairn_rockchip/deps
            boards/cairn_rockchip/_build
            boards/cairn_rockchip/native/cairn_rockchip/target
            ~/.cargo/registry
            ~/.cache/ort.pyke.io
          key: rockchip-board-${{ needs.release-toolchain.outputs.image }}-${{ hashFiles('mix.lock', 'boards/cairn_rockchip/mix.lock', 'boards/cairn_rockchip/native/cairn_rockchip/Cargo.lock') }}
          restore-keys: |
            rockchip-board-${{ needs.release-toolchain.outputs.image }}-

      - run: mix deps.get
        working-directory: boards/cairn_rockchip

      - run: mix format --check-formatted
        working-directory: boards/cairn_rockchip

      - run: mix compile --warnings-as-errors
        working-directory: boards/cairn_rockchip

      - run: mix dialyzer --format github
        working-directory: boards/cairn_rockchip

      - run: mix deps.get

      - run: tools/ci/rockchip-board-test.sh
        env:
          WORK: ${{ runner.temp }}/rockchip-board

      - run: mix test --only rockchip_board test/cairn/rockchip_release_test.exs
        env:
          CAIRN_ROCKCHIP_BOARD_DIR: ${{ runner.temp }}/rockchip-board/board

      - run: mix test
        working-directory: boards/cairn_rockchip

  cairn-detect:
    name: Rust · Format · Clippy · Test · Release build
    runs-on: ubuntu-latest
    # Debian 13 (trixie) ships FFmpeg 7.1, which is what rsmpeg's `ffmpeg7_1`
    # feature binds against — the runner image's own Ubuntu 24.04 ships 6.1 and
    # would need a different feature. It is also one of the two targets
    # plugins/cairn-detect/README.md documents as "builds as-is", so this job
    # doubles as a check that those instructions still work. glibc 2.41 here is
    # past onnxruntime's 2.38 requirement, so src/glibc_compat.rs stays inert.
    container: debian:13

    env:
      # Both overrides are mandatory outside the dev container:
      # .cargo/config.toml pins FFMPEG_PKG_CONFIG_PATH at /opt/ffmpeg7 (and the
      # build panics when that is absent) and bakes an rpath to it. Cargo's
      # [env] does not override a value already in the environment, and
      # RUSTFLAGS wins over [build] rustflags — so setting both here leaves the
      # dev loop untouched. Same pair the README gives for a fresh Debian 13.
      FFMPEG_PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
      RUSTFLAGS: ""
      CARGO_TERM_COLOR: always

    steps:
      # All eight libav*/libsw*/libpostproc dev packages, not just the five the
      # crate names: rusty_ffmpeg's build script pkg-configs the whole FFmpeg
      # library set, so one missing .pc fails the build even though nothing
      # here calls into it.
      #
      # libssl-dev is not obvious and not optional: ort-sys's *build script*
      # fetches the prebuilt onnxruntime over TLS via ureq -> native-tls ->
      # openssl-sys, so a missing libssl-dev fails the build before any of
      # this crate compiles. It is present in the dev container only because
      # the Dockerfile installs it for kerl.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libpostproc-dev libswresample-dev libswscale-dev \
            libssl-dev \
            curl ca-certificates git

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ort downloads a ~90 MB prebuilt static onnxruntime on a cold build.
      - name: Cache cargo registry, target and the onnxruntime download
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            plugins/cairn-detect/target
            plugins/cairn-native/target
            plugins/cairn-ort/target
            boards/cairn_rockchip/native/cairn_rockchip/target
            test/fixture_board/native/cairn_fixture_board/target
          key: cargo-debian13-${{ hashFiles('plugins/*/Cargo.lock', 'boards/cairn_rockchip/native/cairn_rockchip/Cargo.lock', 'test/fixture_board/native/cairn_fixture_board/Cargo.lock') }}
          restore-keys: |
            cargo-debian13-

      # working-directory is set per step rather than as a job default: the apt
      # step above runs before checkout, when plugins/cairn-detect does not yet
      # exist and a job-wide default would fail it.
      - run: cargo fmt --check
        working-directory: plugins/cairn-detect

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-detect

      # Includes the composed-tail tests in src/infer/heads.rs, which pin a
      # whole decoded `Vec<Det>` per head per projection. They replaced the
      # checked-in golden fixtures the infer.rs refactor was built on: the
      # coverage stayed, the re-record-on-red machinery did not.
      #
      # Also runs tests/norm_box_invariant.rs, the trybuild compile-fail case
      # that guards NormBox's private field. It needs no step of its own, but it
      # does need a warm ~/.cargo/registry: trybuild builds a scratch crate under
      # target/tests/trybuild and runs a second cargo over it with --offline. The
      # generated manifest carries no dev-dependencies of its own, so what has to
      # be present is only what the case itself compiles — which the
      # `cargo clippy --all-targets` step above has already fetched. Verified by
      # deleting target/tests/trybuild and re-running with this job's env.
      - run: cargo test
        working-directory: plugins/cairn-detect

      - run: cargo build --release
        working-directory: plugins/cairn-detect

      # Broken intra-doc links are a *rustdoc* lint, so clippy and
      # -D warnings cannot see them — the module split in #22 broke twelve of
      # them with every other gate green. --document-private-items because
      # the docs exist for maintainers: almost everything worth reading in the
      # crate is private to it, and the default doc build visits none of that.
      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-detect
        env:
          RUSTDOCFLAGS: -D warnings

      # cairn-native and cairn-ort, same gates. cairn-native's end-to-end clip
      # tests need model artifacts CI does not carry, and its sanctioned waiver
      # is the env var — a test that silently skipped would be indistinguishable
      # from one that passed, so the waiver has to be explicit here.
      - run: cargo fmt --check
        working-directory: plugins/cairn-native

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-native

      - run: cargo test
        working-directory: plugins/cairn-native
        env:
          CAIRN_NATIVE_SKIP_CLIP: "1"

      - run: cargo build --release
        working-directory: plugins/cairn-native

      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-native
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo fmt --check
        working-directory: plugins/cairn-ort

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: plugins/cairn-ort

      - run: cargo test
        working-directory: plugins/cairn-ort

      # Without the `nif` feature: the configuration the board crate links.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
        working-directory: plugins/cairn-ort

      - run: cargo test --no-default-features
        working-directory: plugins/cairn-ort

      - run: cargo build --release
        working-directory: plugins/cairn-ort

      - run: cargo doc --no-deps --document-private-items
        working-directory: plugins/cairn-ort
        env:
          RUSTDOCFLAGS: -D warnings

      # The Rockchip board library's native half, same gates.
      - run: cargo fmt --check
        working-directory: boards/cairn_rockchip/native/cairn_rockchip

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: boards/cairn_rockchip/native/cairn_rockchip

      - run: cargo test
        working-directory: boards/cairn_rockchip/native/cairn_rockchip

      - run: cargo build --release
        working-directory: boards/cairn_rockchip/native/cairn_rockchip

      - run: cargo doc --no-deps --document-private-items
        working-directory: boards/cairn_rockchip/native/cairn_rockchip
        env:
          RUSTDOCFLAGS: -D warnings

      # The fixture board's stub NIF, same gates.
      - run: cargo fmt --check
        working-directory: test/fixture_board/native/cairn_fixture_board

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: test/fixture_board/native/cairn_fixture_board

      - run: cargo test
        working-directory: test/fixture_board/native/cairn_fixture_board

      - run: cargo build --release
        working-directory: test/fixture_board/native/cairn_fixture_board

      - run: cargo doc --no-deps --document-private-items
        working-directory: test/fixture_board/native/cairn_fixture_board
        env:
          RUSTDOCFLAGS: -D warnings

  qdq-export-tools:
    name: qdq-export pytest
    runs-on: ubuntu-latest
    # The quantization tooling's regression suite (campaign meta contract,
    # analyzer verdicts, qparam gate) — python, pinned by requirements.txt,
    # the same manifest that builds model/quant-venv.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/qdq-export/requirements.txt

      - run: pip install -r tools/qdq-export/requirements.txt

      - run: python -m pytest tools/qdq-export

  rknn-export-tools:
    name: rknn-export pytest
    runs-on: ubuntu-latest
    # The toolkit is not installed: the build needs it, the pure parts do not.
    # Those parts are tested because the parity numbers decide which rungs ship.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/rknn-export/tests/requirements.txt

      - run: pip install -r tools/rknn-export/tests/requirements.txt

